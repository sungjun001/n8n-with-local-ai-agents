version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./data:/home/node/.n8n
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_TUNNEL_SUBDOMAIN=${N8N_TUNNEL_SUBDOMAIN} # 필요에 따라 설정
      - N8N_TUNNEL_AUTH_CREDENTIALS=${N8N_TUNNEL_AUTH_CREDENTIALS} # 필요에 따라 설정
      - DB_TYPE=${DB_TYPE:-sqlite} # 기본 SQLite 사용
      - DB_SQLITE_FILENAME=/home/node/.n8n/database.sqlite
      # PostgreSQL 사용하는 경우 아래 주석 해제 및 설정
      # - DB_TYPE=postgres
      # - DB_POSTGRESQL_HOST=your_postgres_host
      # - DB_POSTGRESQL_PORT=5432
      # - DB_POSTGRESQL_DATABASE=n8n
      # - DB_POSTGRESQL_USER=your_postgres_user
      # - DB_POSTGRESQL_PASSWORD=your_postgres_password
    depends_on:
      # PostgreSQL 사용하는 경우 아래 주석 해제
      # - postgres
    networks:
      - n8n-network

  # PostgreSQL 사용하는 경우에만 활성화
  # postgres:
  #   image: postgres:13
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - ./postgres-data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_USER=your_postgres_user
  #     - POSTGRES_PASSWORD=your_postgres_password
  #     - POSTGRES_DB=n8n
  #   networks:
  #     - n8n-network

networks:
  n8n-network:
