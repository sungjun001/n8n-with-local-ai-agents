networks:
  n8n-v2-network:
    driver: bridge
  web:
    # Traefik ↔ 서비스 간 HTTP 트래픽용
    external: true

services:
  n8n-v2:
    build: ./n8n
    container_name: n8n-v2
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-v2-data:/home/node/.n8n
      - ./custom-v2-nodes:/home/node/.n8n/custom
      - ./download:/home/node/.n8n-files

    environment:
      # --- DB 연결 설정 ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-v2-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public

      # --- n8n 기본 설정 ---
      - N8N_HOST=${DOMAIN}
      - WEBHOOK_URL=http://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=http://${DOMAIN}/
      - TZ=Asia/Seoul
      - N8N_SECURE_COOKIE=false
      - N8N_PUSH_BACKEND=sse

      # --- Runner 설정 ---
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNER_SECRET}

      # --- 기타 설정 ---
      - N8N_PROXY_HOPS=1
      - N8N_ALLOW_EXECUTE_COMMAND=true
      - N8N_ENABLE_NODE_DEV=true

      - NODES_EXCLUDE=[]

      - N8N_FILESYSTEM_PATH_WHITELIST=/download

      # --- [Option A] Nginx Proxy (Active) ---
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=5678
      - LETSENCRYPT_HOST=${DOMAIN}

    labels:
      # --- [Option B] Traefik Proxy (Disabled by default) ---
      # To enable: Uncomment lines below and Comment out 'Nginx Proxy' env vars above
      - "traefik.enable=false" # Change to true ONLY if using Traefik
      - "traefik.http.routers.n8n.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

    depends_on:
      - n8n-v2-postgres
      - n8n-v2-task-runner
    networks:
      - web
      - n8n-v2-network

  n8n-v2-task-runner:
    build: ./runner-python # 아까 만든 Python용 Dockerfile 경로
    container_name: n8n-v2-task-runner
    restart: unless-stopped
    environment:
      # n8n 메인 컨테이너 이름(n8n-v2)과 포트(5679)를 지정
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n-v2:5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNER_SECRET}
    networks:
      - n8n-v2-network

  n8n-v2-postgres:
    image: postgres:16-alpine
    container_name: n8n-v2-postgres
    restart: unless-stopped
    volumes:
      - ./postgres-v2-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 공식 postgres 이미지는 *_NON_ROOT_* 변수를 지원하지 않습니다.
      # 비루트 계정을 자동 생성하려면 bitnami/postgresql 같은 이미지를 사용하거나
      # 초기화 스크립트를 마련하세요.
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - n8n-v2-network
